name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  build-and-validate:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            student-job-tracker-frontend/package-lock.json
            student-job-tracker-backend/package-lock.json

      - name: Install frontend dependencies
        working-directory: student-job-tracker-frontend
        run: npm ci

      - name: Install backend dependencies
        working-directory: student-job-tracker-backend
        run: npm ci

      - name: Build frontend
        working-directory: student-job-tracker-frontend
        run: npm run build

      - name: Validate backend source
        working-directory: student-job-tracker-backend
        run: |
          node --check server.js
          node --check config/db.js

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Check Terraform formatting
        run: terraform fmt -check -recursive infrastructure/terraform

      - name: Initialize Terraform
        working-directory: infrastructure/terraform
        run: terraform init -backend=false -input=false

      - name: Validate Terraform
        working-directory: infrastructure/terraform
        run: terraform validate

      - name: Build Docker images
        run: docker compose --env-file .env.example build

      - name: Scan backend image
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: student-job-tracker-backend:latest
          format: table
          severity: CRITICAL
          exit-code: "1"

      - name: Scan frontend image
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: student-job-tracker-frontend:latest
          format: table
          severity: CRITICAL
          exit-code: "1"
